<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenStore — loja aberta de aplicativos</title>
    <meta
      name="description"
      content="A OpenStore é uma loja de aplicativos aberta: publicação gratuita, download do binário certo para o seu sistema e guias de instalação, publicação e verificação de arquivos."
    />
    <link rel="icon" type="image/png" href="./icon.png?v=6" />
    <meta name="theme-color" content="#fbfaf7" />
    <script>
      // aplica o tema salvo antes do primeiro paint, sem piscar
      try {
        var saved = localStorage.getItem('openstore.theme')
        var dark =
          saved === 'dark' ||
          ((!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
